name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench
      - run: npm run results:check
      - run: npm run build -w @cfb/client
  parity-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fixtures still match the Python reference engine
        run: |
          cp fixtures/engine/parity.json /tmp/committed.json
          python3 reference/make_fixtures.py
          cmp fixtures/engine/parity.json /tmp/committed.json
